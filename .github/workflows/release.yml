name: Release

# A pushed version tag (vX.Y.Z) builds the distribution zip and publishes it as
# the release asset – see docs/adr/0005-automated-tag-release-stable-asset.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:

  release:
    name: Build and publish the release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify the plugin header version matches the tag
        run: |
          header_version="$(grep -E '^[[:space:]]*\*[[:space:]]*Version:' kntnt-unlink-unpublished.php \
            | head -1 \
            | sed -E 's/.*Version:[[:space:]]*([0-9A-Za-z.+-]+).*/\1/')"
          # The tag is v-prefixed (vX.Y.Z, ADR-0005); the header carries the bare
          # version, so compare against the tag with its leading `v` stripped.
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$header_version" != "$tag_version" ]]; then
            echo "::error::Plugin header version ($header_version) does not match tag (${GITHUB_REF_NAME})."
            exit 1
          fi
          echo "Header version matches tag: ${GITHUB_REF_NAME}"

      - name: Build the runtime zip
        # The plugin has no runtime dependencies, so bin/build-release-assets
        # only takes the runtime keep-list from the tagged tree and writes
        # release-assets/kntnt-unlink-unpublished.zip – the version-less, stable
        # asset name.
        run: bin/build-release-assets

      - name: Create the release and upload the asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The notes are the CHANGELOG.md section for the version, whose heading
        # carries the bare version. Without one, GitHub generates them, so a
        # release is never published without notes.
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="${GITHUB_REF_NAME#v}" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[[^][]+\]:[[:space:]]/ { exit }
            capture { print }
          ' CHANGELOG.md > "$notes_file"
          if grep -q '[^[:space:]]' "$notes_file"; then
            printf '\n**Full changelog:** https://github.com/%s/blob/%s/CHANGELOG.md\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> "$notes_file"
            notes=(--notes-file "$notes_file")
          else
            echo "::warning::No CHANGELOG section for ${GITHUB_REF_NAME#v}; using auto-generated notes."
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" "${notes[@]}" release-assets/*
